<dialog
    id="local-config-modal"
    class="nf-modal"
    aria-labelledby="local-config-title"
    aria-describedby="local-config-description"
    data-local-config-modal
>
    <div class="w-full max-w-lg overflow-x-hidden rounded-panel bg-white p-6 shadow-panel">
        <div class="mb-5 flex items-start justify-between gap-4">
            <div>
                <h2 id="local-config-title" class="text-xl font-semibold text-ink-900">Configuración avanzada</h2>
                <p id="local-config-description" class="mt-1 text-sm leading-6 text-slate-600">Parámetros de conexión locales. Los cambios se aplican de inmediato.</p>
            </div>
            <button type="button" id="local-config-close" class="inline-flex h-9 w-9 flex-none items-center justify-center rounded-full border border-slate-300 bg-white text-lg font-semibold text-slate-600 transition hover:border-ink-700 hover:bg-ink-50 hover:text-ink-900" aria-label="Cerrar configuración">✕</button>
        </div>
        <div class="mb-5 flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3">
            <span class="text-sm font-medium text-slate-700">Estado de la API:</span>
            <span id="api-health-badge" class="inline-flex items-center gap-2 rounded-full px-3 py-1 text-sm font-semibold" data-state="checking">
                <span class="h-2 w-2 rounded-full bg-slate-400" data-dot></span>
                <span data-label>Verificando…</span>
            </span>
        </div>
        <form id="local-config-form" class="space-y-4" novalidate>
            <div>
                <label for="id_neuroflex_api_base_url" class="nf-label">NEUROFLEX_API_BASE_URL</label>
                <input type="url" id="id_neuroflex_api_base_url" name="NEUROFLEX_API_BASE_URL" class="nf-input min-h-11 text-sm" required>
            </div>
            <div>
                <label for="id_cognito_client_id" class="nf-label">COGNITO_CLIENT_ID</label>
                <input type="text" id="id_cognito_client_id" name="COGNITO_CLIENT_ID" class="nf-input min-h-11 text-sm" required>
            </div>
            <div>
                <label for="id_github_token" class="nf-label">GITHUB_TOKEN</label>
                <div class="flex items-center gap-3">
                    <span id="github-token-masked" class="min-h-11 flex-1 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2.5 text-sm text-slate-700 break-all" aria-live="polite"></span>
                    <button type="button" id="github-token-change" class="shrink-0 rounded-lg px-3 py-2 text-sm font-semibold text-ink-700 transition hover:bg-slate-100">Cambiar</button>
                </div>
                <input type="password" id="id_github_token" name="GITHUB_TOKEN" class="nf-input min-h-11 text-sm hidden" autocomplete="off" aria-hidden="true">
                <p class="nf-helper mt-1 text-xs text-slate-500">Si no ingresas un nuevo token, se conservará el valor actual.</p>
            </div>
            <p id="local-config-message" class="hidden rounded-xl px-4 py-3 text-sm leading-6" role="status" aria-live="polite"></p>
            <div class="flex items-center justify-end gap-3 pt-2">
                <button type="button" id="local-config-cancel" class="rounded-xl px-5 py-2.5 text-sm font-semibold text-ink-700 transition hover:bg-slate-100">Cancelar</button>
                <button type="submit" id="local-config-save" class="inline-flex min-h-11 items-center justify-center gap-2 rounded-xl bg-ink-700 px-5 py-2.5 text-sm font-semibold text-white transition hover:bg-ink-800">Guardar</button>
            </div>
        </form>
    </div>
</dialog>

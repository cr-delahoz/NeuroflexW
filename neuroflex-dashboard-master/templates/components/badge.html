{% if tone == "success" %}
<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-success"><span aria-hidden="true">●</span> {{ label }}</span>
{% elif tone == "warning" %}
<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full bg-amber-50 px-3 py-1 text-xs font-semibold text-warning"><span aria-hidden="true">●</span> {{ label }}</span>
{% elif tone == "danger" %}
<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full bg-rose-50 px-3 py-1 text-xs font-semibold text-danger"><span aria-hidden="true">●</span> {{ label }}</span>
{% else %}
<span class="inline-flex items-center gap-1 whitespace-nowrap rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700"><span aria-hidden="true">●</span> {{ label }}</span>
{% endif %}

<section class="nf-panel p-5 sm:p-6">
    {% if title %}
    <div class="mb-4">
        <h3 class="text-lg font-semibold text-ink-900">{{ title }}</h3>
        {% if description %}
        <p class="mt-1 text-sm text-slate-600">{{ description }}</p>
        {% endif %}
    </div>
    {% endif %}
    {{ content }}
</section>

{% if page_obj and page_obj.paginator.num_pages > 1 %}
<nav data-pagination="true" class="mt-6 flex items-center justify-between" aria-label="Paginacion">
    <p class="text-sm text-slate-600">Pagina {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</p>
    <div class="flex gap-2">
        {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="rounded-xl border border-border px-4 py-2 text-sm font-semibold text-ink-900">Anterior</a>
        {% endif %}
        {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="rounded-xl border border-border px-4 py-2 text-sm font-semibold text-ink-900">Siguiente</a>
        {% endif %}
    </div>
</nav>
{% endif %}
